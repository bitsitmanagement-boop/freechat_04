<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Hanzala04 Offline Messenger</title>
    <script>
      (function() {
        var l = window.location;
        var pathSegments = l.pathname.slice(1).split('/');
        var basePath = pathSegments.length > 0 && pathSegments[0] ? '/' + pathSegments[0] + '/' : '/';
        window.location.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          basePath + (l.search ? l.search : '') + (l.hash ? l.hash : '')
        );
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 50px; background: #f8fafc; color: #0f172a;">
    <h2 style="color: #059669;">Redirecting to Hanzala04...</h2>
    <p>If you are not redirected automatically, <a href="/freechat_04/" style="color: #059669; font-weight: bold;">click here</a>.</p>
  </body>
</html>
